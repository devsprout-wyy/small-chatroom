<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>极简聊天室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #eef1f6;
         display: flex; justify-content: center; height: 100vh; }
  .app { display: flex; flex-direction: column; width: 640px; background: #fff;
         box-shadow: 0 0 20px rgba(0,0,0,.08); }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid #e6e8eb; }
  header h1 { flex: 1; font-size: 16px; }
  select, input, button { font-family: inherit; font-size: 14px; padding: 6px 8px;
           border: 1px solid #d8dde5; border-radius: 6px; outline: none; }
  select:focus, input:focus { border-color: #3a7afe; }
  input#name { width: 100px; }
  /* 消息区：唯一可滚动的区域 */
  #box { flex: 1; overflow-y: auto; padding: 16px; background: #f2f4f8; }
  .row { margin-bottom: 12px; }
  .meta { font-size: 12px; color: #8b93a1; margin-bottom: 3px; }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 8px;
            background: #fff; font-size: 14px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word;      /* 保留换行、长串折行 */
            box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .row.me { text-align: right; }
  .row.me .bubble { background: #3a7afe; color: #fff; }
  .sys { text-align: center; font-size: 12px; color: #a7aeb9; margin: 10px 0; }
  .err { text-align: center; font-size: 12px; color: #ef4444; margin: 10px 0; }
  .empty { text-align: center; color: #a7aeb9; font-size: 13px; padding: 40px 0; }
  footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #e6e8eb; }
  #text { flex: 1; height: 40px; }
  #send { width: 80px; color: #fff; background: #3a7afe; border: none; cursor: pointer; }
  #send:hover { background: #2b66e0; }
  #send:disabled { background: #b9cdf7; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>极简聊天室</h1>
    <input id="name" value="游客" maxlength="20" placeholder="昵称">
    <select id="roomList"></select>
  </header>
  <div id="box"><div class="empty">还没有人说话，发一条打个招呼吧 👋</div></div>
  <footer>
    <input id="text" placeholder="说点什么…（Enter 发送）">
    <button id="send">发送</button>
  </footer>
</div>
<script>
const box = document.getElementById('box');
const roomList = document.getElementById('roomList');
const text = document.getElementById('text');
const send = document.getElementById('send');
const name = document.getElementById('name');
let ws = null;                        // 当前 WebSocket 连接
let currentName = '';                 // 当前连接使用的昵称（用于判断是否需要重连）
// 把一条消息渲染到页面上
function addMsg(who, content, mine) {
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' me' : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;       // 用 textContent 而不是 innerHTML，天然防 XSS
  row.append(meta, bubble);
  box.append(row);
  box.scrollTop = box.scrollHeight;   // 自动滚到底部
}
// 系统提示 / 错误提示
function addTip(content, isError) {
  const div = document.createElement('div');
  div.className = isError ? 'err' : 'sys';
  div.textContent = content;
  box.append(div);
  box.scrollTop = box.scrollHeight;
}
// 加载房间列表到下拉框
async function loadRooms() {
  const rooms = await (await fetch('/api/rooms')).json();
  const keep = roomList.value;
  roomList.innerHTML = '';
  for (const r of rooms) {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name;
    roomList.append(opt);
  }
  // 尽量保持原来选中的房间
  if (keep && rooms.some(r => String(r.id) === keep)) roomList.value = keep;
}
// 连接（切换房间 = 关掉旧连接 + 用新房间号重连）
function connect() {
  if (ws) { ws.onclose = null; ws.close(); }      // 摘掉 onclose，避免触发重连提示
  box.innerHTML = '<div class="empty">正在加载…</div>';
  const id = roomList.value;
  const who = name.value.trim() || '游客';
  currentName = who;                              // 记下这次连接用的昵称
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
            + location.host + '/ws?room_id=' + id + '&username=' + encodeURIComponent(who);
  ws = new WebSocket(url);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'history') {                 // 进房间时后端推的历史消息
      box.innerHTML = '';
      if (!msg.messages.length) {
        box.innerHTML = '<div class="empty">还没有人说话，发一条打个招呼吧 👋</div>';
      }
      for (const m of msg.messages) addMsg(m.username, m.content, m.username === who);
    } else if (msg.type === 'message') {          // 有人发言的实时广播
      addMsg(msg.username, msg.content, msg.username === who);
    } else if (msg.type === 'error') {            // 后端返回的格式错误提示
      addTip(msg.content, true);
    }
  };
  ws.onopen = () => { send.disabled = false; text.focus(); };
  ws.onclose = () => { send.disabled = true; addTip('连接已断开，正在重连…'); };
  ws.onerror = () => addTip('连接出错', true);
}
// 发送消息
function sendMsg() {
  const content = text.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ content }));           // 按约定的协议发送
  text.value = '';                                // 不等回显，等后端广播回来再渲染
  text.focus();
}
// ---------- 事件绑定 ----------
roomList.onchange = connect;                      // 切换房间
send.onclick = sendMsg;
text.onkeydown = (e) => { if (e.key === 'Enter') sendMsg(); };
// 改昵称后按 Enter 立即生效：昵称是"连接时"传给服务端的，      
// 不重连的话服务端还在用旧名字，所以这里主动重连一次
name.onkeydown = (e) => {
  if (e.key !== 'Enter') return;
  const who = name.value.trim() || '游客';
  if (who === currentName) return;                // 没改就不用重连
  connect();                                      // 用新昵称重连
};                                 
// ---------- 启动 ----------
(async () => {
  await loadRooms();
  connect();
  setInterval(loadRooms, 5000);                   // 每 5 秒刷新一次房间列表
})();
</script>
</body>
</html>
